name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-core:
    name: "Build scala core module"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build core module
        run: nix build -L .

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: scala-plugin
          path: result/

  build-ui:
    name: "Build scala-ui module"
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build UI module
        run: cd scala-ui && nix build -L --override-input scala path:.. .

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: scala-ui-plugin
          path: result/

  package-lgx-core:
    name: "Package scala core as .lgx"
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build .lgx package
        run: nix build -L .#lgx-portable

      - name: Upload .lgx artifact
        uses: actions/upload-artifact@v4
        with:
          name: scala.lgx
          path: result/

  package-lgx-ui:
    name: "Package scala-ui as .lgx"
    runs-on: ubuntu-latest
    needs: build-ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build .lgx package
        run: cd scala-ui && nix build -L --override-input scala path:.. .#lgx-portable

      - name: Upload .lgx artifact
        uses: actions/upload-artifact@v4
        with:
          name: scala-ui.lgx
          path: scala-ui/result/

  flake-check:
    name: "Flake metadata check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check flake metadata (core)
        run: nix flake metadata --no-update-lock-file

      - name: Check flake metadata (UI)
        run: cd scala-ui && nix flake metadata --no-update-lock-file --override-input scala path:..

  test-engines:
    name: "Engine tests (fold parity, crypto, interop, catch-up)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      # Build the core so nlohmann_json + openssl land in /nix/store — the C++ harnesses
      # (fold_cpp / catchup_cpp) discover their includes there.
      - name: Populate C++ deps
        run: nix build -L .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile deps
        run: cd mobile && npm install --no-audit --no-fund
      - name: Run engine parity + convergence tests
        run: cd mobile && npm test
